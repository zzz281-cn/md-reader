<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown 阅读器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ① 标签栏 -->
  <div class="tabbar">
    <div class="tabs" id="tabs"></div>
    <button class="tab-plus" id="btn-open-tab" title="打开文件（Ctrl+O）">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="tabbar-drag"></div>
  </div>

  <!-- ② 文档信息栏 -->
  <div class="docbar">
    <div class="docbar-left">
      <span class="doc-name" id="doc-name">未打开文件</span>
      <span class="save-state saved" id="save-state">
        <svg viewBox="0 0 12 12" width="11" height="11"><path d="M2.2 6.4l2.4 2.4 5-5.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="save-text">已保存</span>
      </span>
    </div>
    <div class="docbar-right">
      <button class="tool" id="btn-edit" title="编辑 / 预览（Ctrl+E）">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M11.1 2.6l2.3 2.3-8 8-3.1.8.8-3.1 8-8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button class="tool" id="btn-find" title="查找（Ctrl+F）">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.2 10.2L13.5 13.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button class="tool" id="btn-more" title="更多">
        <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="3.5" cy="8" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/><circle cx="12.5" cy="8" r="1.1" fill="currentColor"/></svg>
      </button>
      <button class="ai-btn" id="btn-ai">
        <svg viewBox="0 0 16 16" width="13" height="13"><path d="M8 2.2l1.3 3.3 3.3 1.3-3.3 1.3L8 11.4 6.7 8.1 3.4 6.8l3.3-1.3L8 2.2z" fill="currentColor"/></svg>
        AI 润色
      </button>
    </div>
  </div>

  <!-- ③ 正文 -->
  <div class="content" id="content">
    <article class="md" id="preview"></article>
    <textarea class="editor" id="editor" spellcheck="false" hidden></textarea>

    <div class="empty" id="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 64 64" width="52" height="52"><path d="M16 8h22l12 12v36a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M38 8v12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M22 34h20M22 42h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <p class="empty-title">打开一个 Markdown 文件</p>
      <p class="empty-sub">Ctrl+O 选择文件 · 或把 .md 文件拖进这个窗口</p>
      <button class="empty-btn" id="btn-open-empty">选择文件</button>
    </div>
  </div>

  <!-- 查找条 -->
  <div class="findbar" id="findbar" hidden>
    <input id="find-input" type="text" placeholder="在文档中查找…" spellcheck="false">
    <span class="find-count" id="find-count">0 / 0</span>
    <button class="tool" id="find-prev" title="上一个">↑</button>
    <button class="tool" id="find-next" title="下一个">↓</button>
    <button class="tool" id="find-close" title="关闭">✕</button>
  </div>

</div>

<!-- 更多菜单 -->
<div class="menu" id="menu" hidden>
  <button data-act="open">打开文件…<span class="kbd">Ctrl+O</span></button>
  <button data-act="save">保存<span class="kbd">Ctrl+S</span></button>
  <button data-act="saveas">另存为…</button>
  <button class="sep" data-act="export">导出 HTML…</button>
  <button data-act="copy">复制全文</button>
  <button data-act="reveal">在资源管理器中显示</button>
</div>

<!-- 轻提示 -->
<div class="toast" id="toast" hidden></div>

<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
